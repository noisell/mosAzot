version: "3.9"

services:
  redis_azot:
    image: redis:6
    container_name: redis_azot
    command: --port 6381
    restart: always
    expose:
      - 6381
    networks:
      - main_backend_azot

  bot_azot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: bot_azot
    env_file:
      - .env-prod
    command: ["python", "-m", "bot.main"]
    networks:
      - main_backend_azot

  backend_azot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_azot
    restart: always
    env_file:
      - .env-prod
    depends_on:
      - redis_azot
    ports:
      - "8001:8001"
    command: ["/start.sh"]
    networks:
      - main_backend_azot

networks:
  main_backend_azot: